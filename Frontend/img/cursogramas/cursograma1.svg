<text x="772" y="94" font-size="11" font-weight="bold" text-decoration="underline">Formularios</text>
<text x="774" y="110" font-size="10">FD: Formulario de Diagnóstico (web)</text>
<text x="774" y="126" font-size="10">IR: Informe de Resultado (Índice Eco)</text>
<text x="774" y="142" font-size="10">PA: Propuesta de Asesoramiento</text>
<text x="772" y="170" font-size="11" font-weight="bold" text-decoration="underline">Procedimientos</text>
<text x="774" y="186" font-size="10">1 - Controla que el Formulario de Diagnóstico tenga</text>
<text x="774" y="199" font-size="10">    todas las preguntas respondidas.</text>
<text x="774" y="215" font-size="10">2 - Calcula el Índice Eco consultando la Tabla de</text>
<text x="774" y="228" font-size="10">    Puntajes y emite el Informe de Resultado por</text>
<text x="774" y="241" font-size="10">    duplicado.</text>
<text x="774" y="257" font-size="10">3 - Controla el Informe de Resultado consultando el</text>
<text x="774" y="270" font-size="10">    Historial de Clientes.</text>
<text x="774" y="286" font-size="10">4 - Emite la Propuesta de Asesoramiento por</text>
<text x="774" y="299" font-size="10">    duplicado.</text>
<text x="772" y="327" font-size="11" font-weight="bold" text-decoration="underline">Archivos</text>
<text x="774" y="343" font-size="10">A - Tabla de Puntajes, ordenada por área.</text>
<text x="774" y="359" font-size="10">B - Historial de Clientes, ordenado por correo</text>
<text x="774" y="372" font-size="10">    electrónico.</text>
<text x="774" y="388" font-size="10">C - Diagnósticos, ordenado por fecha.</text>
<text x="774" y="404" font-size="10">D - Propuestas Pendientes (transitorio), ordenado</text>
<text x="774" y="417" font-size="10">    por fecha.</text>
<text x="774" y="433" font-size="10">C2 - Conector: continúa en el Cursograma 2.</text>
