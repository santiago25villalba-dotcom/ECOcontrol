<text x="632" y="94" font-size="11" font-weight="bold" text-decoration="underline">Formularios</text>
<text x="634" y="110" font-size="10">SA: Solicitud de Asesoramiento (web)</text>
<text x="634" y="126" font-size="10">P: Presupuesto</text>
<text x="634" y="142" font-size="10">PM: Plan de Mejora ambiental</text>
<text x="634" y="158" font-size="10">F: Factura C (monotributo)</text>
<text x="632" y="186" font-size="11" font-weight="bold" text-decoration="underline">Procedimientos</text>
<text x="634" y="202" font-size="10">1 - Controla la Solicitud de Asesoramiento</text>
<text x="634" y="215" font-size="10">    consultando la Agenda de Turnos.</text>
<text x="634" y="231" font-size="10">2 - Registra el turno en la Agenda de Turnos y emite</text>
<text x="634" y="244" font-size="10">    el Presupuesto.</text>
<text x="634" y="260" font-size="10">3 - Recibe el Presupuesto firmado, realiza la</text>
<text x="634" y="273" font-size="10">    asesoría y emite el Plan de Mejora por</text>
<text x="634" y="286" font-size="10">    duplicado.</text>
<text x="634" y="302" font-size="10">4 - Emite la Factura C por duplicado.</text>
<text x="632" y="330" font-size="11" font-weight="bold" text-decoration="underline">Archivos</text>
<text x="634" y="346" font-size="10">A - Agenda de Turnos (transitorio), ordenada por</text>
<text x="634" y="359" font-size="10">    fecha.</text>
<text x="634" y="375" font-size="10">B - Legajos de Clientes, ordenado por correo</text>
<text x="634" y="388" font-size="10">    electrónico.</text>
<text x="634" y="404" font-size="10">C2 - Conector: viene del Cursograma 1.</text>
